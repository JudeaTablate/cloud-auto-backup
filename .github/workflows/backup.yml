name: Weekly Cloud Backup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what would change, touch nothing)"
        type: boolean
        default: false
  schedule:
    - cron: "0 0 * * 0" # Sundays 00:00 UTC

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
          disable_base64: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cab
        run: pip install .

      - name: Back up
        env:
          CAB_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: cab run
