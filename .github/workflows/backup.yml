name: Weekly Cloud Backup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what would change, touch nothing)"
        type: boolean
        default: false
  schedule:
    - cron: "0 0 * * 0" # Sundays 00:00 UTC

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
          disable_base64: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cab
        run: pip install .

      - name: Back up this repo
        env:
          CAB_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: cab run

      # Every repo on the account, each as a git bundle under Backups/repos/<name>/.
      # BACKUP_GITHUB_TOKEN is a fine-grained token with read-only Contents on all
      # repos; without it only public repos are backed up.
      - name: Back up all my repos
        env:
          CAB_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          CAB_GITHUB_USER: ${{ github.repository_owner }}
          CAB_GITHUB_TOKEN: ${{ secrets.BACKUP_GITHUB_TOKEN }}
        run: cab repos
